name: API Tests (P0+P1)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.docker.example .env

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v3/api-docs >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 10
          done
          echo "API not ready in time"
          docker compose logs api
          exit 1

      - name: Run P0+P1 regression
        run: bash tests/scripts/run-p0-p1.sh
        env:
          API_BASE: http://localhost:8080
          FRONTEND_BASE: http://localhost:3000

      - name: Upload latest-run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-run
          path: tests/results/latest-run.txt

      - name: Tear down
        if: always()
        run: docker compose down -v
