# Docker Compose 环境（spring.profiles.active=docker）
spring.datasource.url=jdbc:mysql://mysql:3306/color_analysis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

python.service.url=${PYTHON_SERVICE_URL:http://python:5000}
storage.base-dir=${STORAGE_BASE_DIR:/app/storage}
logging.file.name=${BACKEND_LOG_FILE:/app/storage/logs/backend.log}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
server.tomcat.max-http-form-post-size=${MAX_HTTP_FORM_POST_SIZE:50MB}
server.tomcat.max-swallow-size=${MAX_SWALLOW_SIZE:50MB}
